server:
  port: ${PORT:8080}

spring:
  application:
    name: orderflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${DATABASE_USER:orderflow}
    password: ${DATABASE_PASSWORD:orderflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      group-id: ${KAFKA_CONSUMER_GROUP:orderflow}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  redis:
    url: ${REDIS_URL:redis://localhost:6379}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: orderflow

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration-ms: 3600000

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

app:
  demo-mode: ${VITE_DEMO_MODE:false}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:1000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${AUTH_RATE_LIMIT:20}
    customer-per-minute: ${CUSTOMER_RATE_LIMIT:120}
    admin-per-minute: ${ADMIN_RATE_LIMIT:300}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  payment:
    failure-probability: 0.2
    timeout-ms: 750
    failure-mode: ${PAYMENT_FAILURE_MODE:none}
  failure-injection:
    enabled: ${FAILURE_INJECTION_ENABLED:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
