apiVersion: v1
kind: Namespace
metadata:
  name: orderflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
  namespace: orderflow
data:
  DATABASE_URL: "jdbc:postgresql://postgres:5432/orderflow"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  CORS_ORIGINS: "https://example.github.io"
  SPRING_PROFILES_ACTIVE: "prod"
  KAFKA_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  FAILURE_INJECTION_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secrets
  namespace: orderflow
type: Opaque
stringData:
  DATABASE_USER: orderflow
  DATABASE_PASSWORD: orderflow
  JWT_SECRET: change-me-in-production
  GRAFANA_ADMIN_PASSWORD: admin
